name: CD — Build & Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: gym-mgmt-dev-api

jobs:
  # 배포 전에 API 테스트를 먼저 통과해야 한다.
  # (빌드·헬스체크만으로는 업무 로직이 깨진 이미지도 그대로 배포된다)
  test:
    name: API Test
    uses: ./.github/workflows/api-test.yml

  # 빌드·배포는 저장소 변수 RUN_DEPLOY 가 'true' 일 때만 실행한다.
  # AWS 자격 증명이 없는 상태에서 매 push 마다 배포가 실패하는 것을 막기 위한 스위치로,
  # terraform.yml 의 RUN_TERRAFORM_PLAN 과 같은 방식이다.
  # 다시 배포하려면 Settings → Secrets and variables → Actions → Variables 에서
  # RUN_DEPLOY = true 로 두고 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 를 채운다.
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.RUN_DEPLOY == 'true' }}
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $REGISTRY/$ECR_REPOSITORY:latest \
                       ./api
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.RUN_DEPLOY == 'true' }}

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REPOSITORY
          script: |
            # ECR 로그인 (인스턴스 IAM 롤 사용)
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin \
                "$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"

            IMAGE="${{ needs.build-and-push.outputs.image }}"

            docker pull "$IMAGE"

            docker stop gym-api 2>/dev/null || true
            docker rm   gym-api 2>/dev/null || true

            docker run -d \
              --name gym-api \
              --restart unless-stopped \
              -p 8000:8000 \
              -e AWS_REGION="ap-northeast-2" \
              --log-driver awslogs \
              --log-opt awslogs-region=ap-northeast-2 \
              --log-opt awslogs-group=/gym-mgmt-dev/api \
              --log-opt awslogs-create-group=true \
              "$IMAGE"

            # 헬스체크 (최대 30초 대기)
            # /health 는 DB 에 SELECT 1 을 던져 확인하므로, DB 연결이 끊긴 컨테이너는
            # 여기서 걸러진다
            for i in $(seq 1 6); do
              sleep 5
              if curl -sf http://localhost:8000/health; then
                echo "Deploy succeeded"
                exit 0
              fi
            done
            echo "=== Docker logs ==="
            docker logs gym-api --tail 50
            echo "Health check failed" && exit 1
