name: API Test

on:
  workflow_dispatch:
  workflow_call: # CD 파이프라인이 배포 전에 호출
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'sql/**'
      - '.github/workflows/api-test.yml'

jobs:
  pytest:
    name: pytest (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          # 테스트는 테이블을 삭제·재생성하므로 전용 DB 를 쓴다
          POSTGRES_DB: gymdb_test
          POSTGRES_USER: gymadmin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CHECK 정규식·부분 유니크 인덱스가 PostgreSQL 전용이라 실제 DB 로 테스트한다.
      # conftest 는 TEST_DATABASE_URL 만 받고, 이름이 _test 로 끝나지 않으면 실행을 거부한다.
      TEST_DATABASE_URL: postgresql://gymadmin:testpassword@localhost:5432/gymdb_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Run tests
        run: pytest -q
        working-directory: api
