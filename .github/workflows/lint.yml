name: SQL Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Run SQL lint
        run: sqlfluff lint *.sql --dialect oracle || true

      - name: Fix SQL formatting
        run: sqlfluff fix *.sql --dialect oracle --force || true
