name: SQL Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sqlfluff
        run: pip install sqlfluff==4.3.0

      # 예전에는 `|| true` 와 `sqlfluff fix` 가 붙어 있어 위반이 있어도 항상 성공했고,
      # CI 에서 고친 결과는 커밋되지 않아 아무 의미가 없었다. 이제 위반이 있으면 실패한다.
      - name: Lint Oracle SQL (repo root)
        run: sqlfluff lint *.sql

      - name: Lint PostgreSQL SQL (sql/)
        run: sqlfluff lint sql/
