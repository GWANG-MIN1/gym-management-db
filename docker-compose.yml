services:
  db:
    image: postgres:15-alpine
    container_name: gym-db
    environment:
      POSTGRES_DB: gymdb
      POSTGRES_USER: gymadmin
      POSTGRES_PASSWORD: gymadmin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb.d 는 파일명 순서대로 실행 — 스키마 생성 후 샘플 데이터 적재
      - ./sql/01_create_tables_pg.sql:/docker-entrypoint-initdb.d/01_create_tables_pg.sql
      - ./sql/02_insert_sample_data_pg.sql:/docker-entrypoint-initdb.d/02_insert_sample_data_pg.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymadmin -d gymdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    container_name: gym-api
    environment:
      DATABASE_URL: postgresql://gymadmin:gymadmin123@db:5432/gymdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
